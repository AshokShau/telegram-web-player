<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TgMusic</title>

    <style>
        :root {
            --bg: #07080d;
            --text: #f5f5f7;
            --muted: #8d92a1;
            --accent: #7c5cff;
            --accent-light: #a48cff;
            --border: rgba(255, 255, 255, 0.09);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    Helvetica,
                    Arial,
                    sans-serif;

            color: var(--text);

            background:
                    radial-gradient(
                            circle at 50% 35%,
                            rgba(124, 92, 255, 0.16),
                            transparent 35%
                    ),
                    radial-gradient(
                            circle at 15% 90%,
                            rgba(124, 92, 255, 0.06),
                            transparent 30%
                    ),
                    var(--bg);

            display: flex;
            flex-direction: column;
            position: relative;
        }

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                    linear-gradient(
                            rgba(255, 255, 255, 0.018) 1px,
                            transparent 1px
                    ),
                    linear-gradient(
                            90deg,
                            rgba(255, 255, 255, 0.018) 1px,
                            transparent 1px
                    );

            background-size: 55px 55px;

            mask-image: linear-gradient(
                    to bottom,
                    black,
                    transparent 85%
            );
        }

        header {
            height: 72px;
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 32px;

            position: relative;
            z-index: 2;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 16px;
            font-weight: 700;
        }

        .logo {
            width: 34px;
            height: 34px;

            display: grid;
            place-items: center;

            border-radius: 10px;

            background:
                    linear-gradient(
                            135deg,
                            var(--accent),
                            #6042dc
                    );

            box-shadow:
                    0 8px 25px rgba(124, 92, 255, 0.25);

            font-size: 17px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;

            color: var(--muted);

            font-size: 12px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #36d991;

            box-shadow:
                    0 0 12px rgba(54, 217, 145, 0.7);
        }

        main {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .hero {
            width: min(760px, 100%);

            text-align: center;

            position: relative;
            z-index: 1;

            animation: appear 0.8s ease-out;
        }

        .icon {
            width: 76px;
            height: 76px;

            margin: 0 auto 25px;

            display: grid;
            place-items: center;

            border-radius: 22px;

            background:
                    linear-gradient(
                            145deg,
                            rgba(124, 92, 255, 0.22),
                            rgba(124, 92, 255, 0.06)
                    );

            border: 1px solid rgba(124, 92, 255, 0.2);

            box-shadow:
                    0 20px 60px rgba(124, 92, 255, 0.15);

            font-size: 36px;

            animation: float 4s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(48px, 7vw, 76px);

            line-height: 1;

            letter-spacing: -4px;

            font-weight: 800;

            margin-bottom: 22px;
        }

        h1 span {
            background:
                    linear-gradient(
                            110deg,
                            #ffffff,
                            var(--accent-light)
                    );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .description {
            max-width: 570px;

            margin: 0 auto 30px;

            color: var(--muted);

            font-size: 16px;
            line-height: 1.7;
        }

        .actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .button {
            height: 46px;

            padding: 0 20px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            border-radius: 12px;

            font-size: 13px;
            font-weight: 650;

            text-decoration: none;

            transition:
                    transform 0.2s ease,
                    background 0.2s ease,
                    border-color 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .primary {
            background: #f5f5f7;
            color: #090a0e;

            box-shadow:
                    0 12px 35px rgba(255, 255, 255, 0.08);
        }

        .primary:hover {
            background: white;
        }

        .secondary {
            color: var(--text);

            border: 1px solid var(--border);

            background: rgba(255, 255, 255, 0.035);
        }

        .secondary:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.16);
        }

        .info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;

            margin-top: 34px;

            color: #686e7c;

            font-size: 11px;
        }

        .info span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info b {
            color: #9a9fac;
            font-weight: 600;
        }

        .separator {
            width: 3px;
            height: 3px;

            background: #4a4e59;

            border-radius: 50%;
        }

        footer {
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #555a67;

            font-size: 11px;

            position: relative;
            z-index: 2;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        @media (max-width: 600px) {

            header {
                height: 62px;
                padding: 0 18px;
            }

            main {
                padding: 15px;
            }

            .icon {
                width: 64px;
                height: 64px;

                border-radius: 18px;

                font-size: 30px;

                margin-bottom: 21px;
            }

            h1 {
                font-size: clamp(44px, 14vw, 62px);
                letter-spacing: -3px;

                margin-bottom: 18px;
            }

            .description {
                font-size: 14px;
                line-height: 1.6;

                margin-bottom: 25px;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 220px;
            }

            .info {
                gap: 10px;
                margin-top: 27px;
            }

            footer {
                height: 45px;
            }
        }

        @media (max-height: 650px) {

            .icon {
                width: 58px;
                height: 58px;

                font-size: 27px;

                margin-bottom: 16px;
            }

            h1 {
                font-size: 48px;
                margin-bottom: 14px;
            }

            .description {
                margin-bottom: 20px;
            }

            .info {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="brand">
        <div class="logo">♪</div>
        <span>TgMusic</span>
    </div>

    <div class="status">
        <span class="status-dot"></span>
        Online
    </div>

</header>


<main>

    <div class="hero">

        <div class="icon">
            ♪
        </div>

        <h1>
            Music,<br>
            <span>together.</span>
        </h1>

        <p class="description">
            A synchronized music player for Telegram.
            Play music with your friends and keep everyone
            perfectly in sync, in the same room.
        </p>

        <div class="actions">

            <a
                    href="/room"
                    class="button primary"
            >
                Open Web Player
                <span>→</span>
            </a>

            <a
                    href="https://github.com/FallenProjects/telegram-web-player"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="button secondary"
            >
                GitHub
            </a>

        </div>

        <div class="info">

                <span>
                    <b>Real-time</b> sync
                </span>

            <i class="separator"></i>

            <span>
                    <b>Shared</b> queue
                </span>

            <i class="separator"></i>

            <span>
                    <b>Telegram</b> powered
                </span>

        </div>

    </div>

</main>


<footer>
    TgMusic · Synchronized music for Telegram
</footer>

</body>
</html>
